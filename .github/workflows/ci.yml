name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sprintpilot
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sprintpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprintpilot -d sprintpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sprintpilot:ci-test-only@127.0.0.1:5432/sprintpilot_test
      TEST_DATABASE_URL: postgresql://sprintpilot:ci-test-only@127.0.0.1:5432/sprintpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sprintpilot/api db:generate
      - run: pnpm --filter @sprintpilot/api db:migrate
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  insights:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/insights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/insights/go.mod
          cache-dependency-path: services/insights/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project services/agents --locked
      - run: uv run --project services/agents ruff check services/agents
      - run: uv run --project services/agents ruff format --check services/agents
      - run: uv run --project services/agents pytest services/agents/tests
