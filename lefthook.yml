pre-commit:
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec eslint {staged_files}
    format:
      glob: '*.{ts,tsx,js,mjs,json,css,yml,yaml,md}'
      run: pnpm exec prettier --check {staged_files}
commit-msg:
  commands:
    conventional-commit:
      run: node scripts/check-commit.mjs {1}
