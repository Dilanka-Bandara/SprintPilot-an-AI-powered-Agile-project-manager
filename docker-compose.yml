services:
  # Optional local database for the upcoming Prisma and Go event-store milestone.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprintpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: sprintpilot
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sprintpilot -d sprintpilot']
      interval: 5s
      timeout: 5s
      retries: 10
  # Local inbox for future invitation and digest email testing.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres-data:
