[project]
name = "sprintpilot-agents"
version = "0.1.0"
description = "Internal service foundation for SprintPilot ADK agents"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "google-adk"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
